{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sweet Box</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="{% static 'css/bootstrap.min.css' %}" rel="stylesheet">
    <link href="{% static 'css/style.css' %}" rel="stylesheet">
    <style>
        body {
            background-color: var(--sb-bg-app);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(212, 154, 61, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(44, 24, 16, 0.05) 0%, transparent 40%);
            min-height: 100vh;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        .login-card {
            width: 100%;
            max-width: 420px;
            background: #FFFFFF;
            border-radius: var(--sb-radius-xl);
            border: 1px solid var(--sb-border-subtle);
            box-shadow: 0 20px 45px rgba(44, 24, 16, 0.12);
            overflow: hidden;
            animation: sbFadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .login-header {
            background: linear-gradient(135deg, var(--sb-espresso-dark) 0%, var(--sb-espresso) 100%);
            border-bottom: 2px solid var(--sb-gold);
            padding: 2.2rem 2rem 1.8rem;
        }
        .letter-spacing-2 {
            letter-spacing: 0.35em;
        }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center p-3">

    <div class="login-card">
        <div class="login-header text-center">
            <div class="d-inline-flex align-items-center justify-content-center mb-3">
                <span class="sb-brand-logo" style="width:48px;height:48px;font-size:1.35rem;">
                    <i class="fas fa-cookie-bite"></i>
                </span>
            </div>
            <h3 class="fw-bold mb-1" style="background: linear-gradient(135deg, var(--sb-gold-light) 0%, var(--sb-gold) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">Sweet Box</h3>
            <small style="color: var(--sb-text-subtle); letter-spacing: 0.03em;">Enterprise Management Platform</small>
        </div>
        <div class="card-body p-4" style="background-color: #FFFFFF;">
            <div id="error-message" class="alert alert-danger d-none py-2 small fw-bold"></div>
            
            <!-- Step 1: Email & Password -->
            <form id="loginForm" onsubmit="processLogin(event)">
                <div class="mb-3">
                    <label class="form-label fw-bold text-title small">Email Address</label>
                    <div class="input-group">
                        <span class="input-group-text bg-white border-end-0" style="border-color: var(--sb-border-subtle);"><i class="fas fa-envelope text-muted"></i></span>
                        <input type="email" id="email" class="form-control border-start-0" placeholder="name@sweetbox.ph" required>
                    </div>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-bold text-title small">Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-white border-end-0" style="border-color: var(--sb-border-subtle);"><i class="fas fa-lock text-muted"></i></span>
                        <input type="password" id="password" class="form-control border-start-0" placeholder="••••••••" required>
                    </div>
                </div>
                <button type="submit" class="btn btn-sb-gold w-100 fw-bold py-2 shadow-sm d-flex align-items-center justify-content-center gap-2 fs-6" id="btn-login">
                    <i class="fas fa-shield-halved"></i> Secure Login
                </button>
            </form>

            <!-- Step 2: OTP Verification (Hidden by default) -->
            <form id="otpForm" class="d-none" onsubmit="verifyOTP(event)">
                <div class="mb-4 text-center">
                    <div class="d-inline-flex p-3 rounded-circle mb-3" style="background-color: var(--sb-gold-subtle); color: var(--sb-espresso);">
                        <i class="fas fa-key fs-4"></i>
                    </div>
                    <h5 class="fw-bold text-title mb-1">Two-Factor Authentication</h5>
                    <p class="text-muted small mb-3">Enter the 6-digit verification code sent to your credentials.</p>
                    <input type="text" id="otp" class="form-control text-center fs-3 fw-bold letter-spacing-2" maxlength="6" placeholder="000000" required>
                </div>
                <button type="submit" class="btn btn-sb-gold w-100 fw-bold py-2 shadow-sm d-flex align-items-center justify-content-center gap-2 fs-6" id="btn-verify">
                    <i class="fas fa-check-circle"></i> Verify & Access
                </button>
            </form>

            <div class="text-center mt-4 pt-3 border-top" style="border-color: var(--sb-border-subtle) !important;">
                <small class="text-muted" style="font-size: 0.775rem;">
                    <i class="fas fa-lock me-1 text-gold"></i> Protected by Enterprise Role-Based Access Control
                </small>
            </div>
        </div>
    </div>

<script>
    let tempEmail = "";

    async function routeUser(token) {
        const userRes = await fetch('/api/analytics/current-user/', { headers: { 'Authorization': `Bearer ${token}` } });
        if (userRes.ok) {
            const userData = await userRes.json();
            const defaultLanding = {
                'Business Owner': '/enterprise/',
                'Admin': '/admin/',
                'Branch Manager': '/scm/',
                'Staff': '/pos/'
            };
            window.location.href = defaultLanding[userData.role] || '/login/';
        } else {
            window.location.href = '/login/';
        }
    }

    async function processLogin(event) {
        event.preventDefault();
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const errorBox = document.getElementById('error-message');
        const btn = document.getElementById('btn-login');
        const trustedToken = localStorage.getItem('trusted_device_token'+ email);
        
        btn.innerText = "Authenticating...";
        btn.disabled = true;

        try {
            const response = await fetch('/api/auth/initiate/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: email, password: password, trusted_device_token: trustedToken })
            });
            const data = await response.json();
            
            if (response.ok) {
                if (data.status === "trusted_bypass") {
                    localStorage.setItem('access_token', data.access);
                    routeUser(data.access);
                } else {
                    tempEmail = data.email;
                    errorBox.classList.add('d-none');
                    document.getElementById('loginForm').classList.add('d-none');
                    document.getElementById('otpForm').classList.remove('d-none');
                }
            } else {
                errorBox.classList.remove('d-none');
                errorBox.innerText = data.error || "Invalid credentials.";
                btn.innerText = "Secure Login";
                btn.disabled = false;
            }
        } catch (error) {
            errorBox.classList.remove('d-none');
            errorBox.innerText = "Network error. Is the server running?";
            btn.innerText = "Secure Login";
            btn.disabled = false;
        }
    }

    async function verifyOTP(event) {
        event.preventDefault();
        const otp = document.getElementById('otp').value;
        const errorBox = document.getElementById('error-message');
        const btn = document.getElementById('btn-verify');
        
        btn.innerText = "Verifying...";
        btn.disabled = true;

        try {
            const response = await fetch('/api/auth/verify/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: tempEmail, otp: otp })
            });
            const data = await response.json();
            
            if (response.ok) {
                localStorage.setItem('access_token', data.access);
                if (data.trusted_device_token) {
                    localStorage.setItem('trusted_device_token' + tempEmail, data.trusted_device_token);
                }
                routeUser(data.access);
            } else {
                errorBox.classList.remove('d-none');
                errorBox.innerText = data.error || "Invalid OTP.";
                btn.innerText = "Verify & Access";
                btn.disabled = false;
            }
        } catch (error) {
            errorBox.classList.remove('d-none');
            errorBox.innerText = "Network error processing OTP.";
            btn.innerText = "Verify & Access";
            btn.disabled = false;
        }
    }
</script>
</body>
</html>
