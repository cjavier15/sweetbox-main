<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1580 1080" width="1580" height="1080">
  <defs>
    <style>
      .boundary { fill: #FFFFFF; stroke: #000000; stroke-width: 2.2; }
      .header-box { fill: #F4F4F4; stroke: #000000; stroke-width: 1.5; }
      .title-text { font-family: 'Segoe UI', Arial, sans-serif; font-size: 19px; font-weight: 800; fill: #000000; letter-spacing: 0.5px; text-anchor: middle; }
      
      .module-box { fill: #FAFAFA; stroke: #666666; stroke-width: 1; stroke-dasharray: 4,4; rx: 6; }
      .module-title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; font-weight: bold; fill: #222222; text-transform: uppercase; letter-spacing: 0.7px; }

      .uc-oval { fill: #FFFFFF; stroke: #000000; stroke-width: 1.5; }
      .uc-label { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; font-weight: 500; fill: #000000; text-anchor: middle; dominant-baseline: central; }

      .stick-stroke { stroke: #000000; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; fill: #FFFFFF; }
      .actor-label-text { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; font-weight: bold; fill: #000000; text-anchor: middle; }

      .assoc-line { stroke: #000000; stroke-width: 1.25; }
      .caption-text { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; font-style: italic; fill: #444444; }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1580" height="1080" fill="#FFFFFF" />

  <!-- Outer System Boundary -->
  <rect x="270" y="35" width="940" height="1000" class="boundary" />
  
  <!-- System Header Box -->
  <rect x="270" y="35" width="940" height="42" class="header-box" />
  <text x="740" y="62" class="title-text">SWEET BOX MULTI-BRANCH ENTERPRISE SYSTEM</text>

  <!-- Subsystem Boundary Modules -->
  <!-- 1. Point-of-Sale (POS) Module -->
  <rect x="290" y="95" width="360" height="360" class="module-box" />
  <text x="305" y="118" class="module-title">Point-of-Sale (POS) Module</text>

  <!-- 2. Inventory Management & Kitchen Production (BOM) Module -->
  <rect x="825" y="95" width="370" height="465" class="module-box" />
  <text x="840" y="118" class="module-title">Inventory & Kitchen Production (BOM)</text>

  <!-- 3. Prescriptive Analytics & Decision Support Module -->
  <rect x="825" y="575" width="370" height="290" class="module-box" />
  <text x="840" y="598" class="module-title">Prescriptive Analytics & AI Engine</text>

  <!-- 4. Administration & Audit Logs Module -->
  <rect x="290" y="685" width="360" height="150" class="module-box" />
  <text x="305" y="708" class="module-title">Administration & Audit Logs</text>

  <!-- 5. Operational Maintenance & 2FA -->
  <rect x="530" y="855" width="420" height="170" class="module-box" />
  <text x="545" y="877" class="module-title">Operational Automation & Security Verification</text>
  <line x1="168" y1="290" x2="332" y2="145" class="assoc-line" />
  <line x1="168" y1="290" x2="317" y2="200" class="assoc-line" />
  <line x1="168" y1="290" x2="332" y2="255" class="assoc-line" />
  <line x1="168" y1="290" x2="327" y2="310" class="assoc-line" />
  <line x1="168" y1="290" x2="337" y2="365" class="assoc-line" />
  <line x1="168" y1="290" x2="327" y2="420" class="assoc-line" />
  <line x1="168" y1="290" x2="569" y2="1005" class="assoc-line" />
  <line x1="1412" y1="290" x2="610" y2="310" class="assoc-line" />
  <line x1="1412" y1="290" x2="1148" y2="135" class="assoc-line" />
  <line x1="1412" y1="290" x2="1153" y2="190" class="assoc-line" />
  <line x1="1412" y1="290" x2="1173" y2="245" class="assoc-line" />
  <line x1="1412" y1="290" x2="1168" y2="300" class="assoc-line" />
  <line x1="1412" y1="290" x2="1143" y2="355" class="assoc-line" />
  <line x1="1412" y1="290" x2="1153" y2="670" class="assoc-line" />
  <line x1="1412" y1="290" x2="911" y2="1005" class="assoc-line" />
  <line x1="1412" y1="770" x2="1153" y2="615" class="assoc-line" />
  <line x1="1412" y1="770" x2="1148" y2="135" class="assoc-line" />
  <line x1="1412" y1="770" x2="1158" y2="410" class="assoc-line" />
  <line x1="1412" y1="770" x2="1173" y2="245" class="assoc-line" />
  <line x1="1412" y1="770" x2="1168" y2="300" class="assoc-line" />
  <line x1="1412" y1="770" x2="1163" y2="465" class="assoc-line" />
  <line x1="1412" y1="770" x2="1153" y2="520" class="assoc-line" />
  <line x1="1412" y1="770" x2="1153" y2="670" class="assoc-line" />
  <line x1="1412" y1="770" x2="1168" y2="725" class="assoc-line" />
  <line x1="1412" y1="770" x2="1153" y2="780" class="assoc-line" />
  <line x1="1412" y1="770" x2="901" y2="895" class="assoc-line" />
  <line x1="1412" y1="770" x2="896" y2="950" class="assoc-line" />
  <line x1="1412" y1="770" x2="1158" y2="835" class="assoc-line" />
  <line x1="1412" y1="770" x2="911" y2="1005" class="assoc-line" />
  <line x1="168" y1="790" x2="327" y2="735" class="assoc-line" />
  <line x1="168" y1="790" x2="337" y2="795" class="assoc-line" />
  <line x1="168" y1="790" x2="579" y2="895" class="assoc-line" />
  <line x1="168" y1="790" x2="584" y2="950" class="assoc-line" />
  <line x1="168" y1="790" x2="569" y2="1005" class="assoc-line" />

  <!-- Actor: Front Staff -->
  <g id="actor-FS">
    <!-- Head -->
    <circle cx="130" cy="240" r="18" class="stick-stroke" />
    <!-- Torso -->
    <line x1="130" y1="258" x2="130" y2="310" class="stick-stroke" />
    <!-- Arms -->
    <line x1="100" y1="276" x2="160" y2="276" class="stick-stroke" />
    <!-- Left Leg -->
    <line x1="130" y1="310" x2="104" y2="354" class="stick-stroke" />
    <!-- Right Leg -->
    <line x1="130" y1="310" x2="156" y2="354" class="stick-stroke" />
    <!-- Label Background & Text -->
    <rect x="25" y="364" width="210" height="26" fill="#FFFFFF" rx="4" />
    <text x="130" y="382" class="actor-label-text">Front Staff</text>
  </g>
  <!-- Actor: System Administrator -->
  <g id="actor-SA">
    <!-- Head -->
    <circle cx="130" cy="740" r="18" class="stick-stroke" />
    <!-- Torso -->
    <line x1="130" y1="758" x2="130" y2="810" class="stick-stroke" />
    <!-- Arms -->
    <line x1="100" y1="776" x2="160" y2="776" class="stick-stroke" />
    <!-- Left Leg -->
    <line x1="130" y1="810" x2="104" y2="854" class="stick-stroke" />
    <!-- Right Leg -->
    <line x1="130" y1="810" x2="156" y2="854" class="stick-stroke" />
    <!-- Label Background & Text -->
    <rect x="25" y="864" width="210" height="26" fill="#FFFFFF" rx="4" />
    <text x="130" y="882" class="actor-label-text">System Administrator</text>
  </g>
  <!-- Actor: Branch Manager -->
  <g id="actor-BM">
    <!-- Head -->
    <circle cx="1450" cy="240" r="18" class="stick-stroke" />
    <!-- Torso -->
    <line x1="1450" y1="258" x2="1450" y2="310" class="stick-stroke" />
    <!-- Arms -->
    <line x1="1420" y1="276" x2="1480" y2="276" class="stick-stroke" />
    <!-- Left Leg -->
    <line x1="1450" y1="310" x2="1424" y2="354" class="stick-stroke" />
    <!-- Right Leg -->
    <line x1="1450" y1="310" x2="1476" y2="354" class="stick-stroke" />
    <!-- Label Background & Text -->
    <rect x="1345" y="364" width="210" height="26" fill="#FFFFFF" rx="4" />
    <text x="1450" y="382" class="actor-label-text">Branch Manager</text>
  </g>
  <!-- Actor: Business Owner -->
  <g id="actor-BO">
    <!-- Head -->
    <circle cx="1450" cy="720" r="18" class="stick-stroke" />
    <!-- Torso -->
    <line x1="1450" y1="738" x2="1450" y2="790" class="stick-stroke" />
    <!-- Arms -->
    <line x1="1420" y1="756" x2="1480" y2="756" class="stick-stroke" />
    <!-- Left Leg -->
    <line x1="1450" y1="790" x2="1424" y2="834" class="stick-stroke" />
    <!-- Right Leg -->
    <line x1="1450" y1="790" x2="1476" y2="834" class="stick-stroke" />
    <!-- Label Background & Text -->
    <rect x="1345" y="844" width="210" height="26" fill="#FFFFFF" rx="4" />
    <text x="1450" y="862" class="actor-label-text">Business Owner</text>
  </g>
  <!-- UC: Process Sale Transaction -->
  <g id="UC_TXN">
    <ellipse cx="470" cy="145" rx="140" ry="20" class="uc-oval" />
    <text x="470" y="145" class="uc-label">Process Sale Transaction</text>
  </g>
  <!-- UC: Record Payment (Cash/E-Wallet/Split) -->
  <g id="UC_PAY">
    <ellipse cx="470" cy="200" rx="155" ry="20" class="uc-oval" />
    <text x="470" y="200" class="uc-label">Record Payment (Cash/E-Wallet/Split)</text>
  </g>
  <!-- UC: Apply Transaction Discount -->
  <g id="UC_DISC">
    <ellipse cx="470" cy="255" rx="140" ry="20" class="uc-oval" />
    <text x="470" y="255" class="uc-label">Apply Transaction Discount</text>
  </g>
  <!-- UC: View Branch Transaction History -->
  <g id="UC_HIST">
    <ellipse cx="470" cy="310" rx="145" ry="20" class="uc-oval" />
    <text x="470" y="310" class="uc-label">View Branch Transaction History</text>
  </g>
  <!-- UC: Process Transaction Refund -->
  <g id="UC_REFUND">
    <ellipse cx="470" cy="365" rx="135" ry="20" class="uc-oval" />
    <text x="470" y="365" class="uc-label">Process Transaction Refund</text>
  </g>
  <!-- UC: Print / Download Digital Receipt -->
  <g id="UC_RCPT">
    <ellipse cx="470" cy="420" rx="145" ry="20" class="uc-oval" />
    <text x="470" y="420" class="uc-label">Print / Download Digital Receipt</text>
  </g>
  <!-- UC: View Live Multi-Branch Stock -->
  <g id="UC_LIVE">
    <ellipse cx="1010" cy="135" rx="140" ry="20" class="uc-oval" />
    <text x="1010" y="135" class="uc-label">View Live Multi-Branch Stock</text>
  </g>
  <!-- UC: Record Manual Stock Adjustment -->
  <g id="UC_ADJ">
    <ellipse cx="1010" cy="190" rx="145" ry="20" class="uc-oval" />
    <text x="1010" y="190" class="uc-label">Record Manual Stock Adjustment</text>
  </g>
  <!-- UC: Execute Kitchen Batch Production (BOM) -->
  <g id="UC_PROD">
    <ellipse cx="1010" cy="245" rx="165" ry="20" class="uc-oval" />
    <text x="1010" y="245" class="uc-label">Execute Kitchen Batch Production (BOM)</text>
  </g>
  <!-- UC: Perform Inter-Branch Product Transfer -->
  <g id="UC_TRANS">
    <ellipse cx="1010" cy="300" rx="160" ry="20" class="uc-oval" />
    <text x="1010" y="300" class="uc-label">Perform Inter-Branch Product Transfer</text>
  </g>
  <!-- UC: Submit Restock Request -->
  <g id="UC_REQ_SUB">
    <ellipse cx="1010" cy="355" rx="135" ry="20" class="uc-oval" />
    <text x="1010" y="355" class="uc-label">Submit Restock Request</text>
  </g>
  <!-- UC: Approve / Reject Restock Request -->
  <g id="UC_REQ_APP">
    <ellipse cx="1010" cy="410" rx="150" ry="20" class="uc-oval" />
    <text x="1010" y="410" class="uc-label">Approve / Reject Restock Request</text>
  </g>
  <!-- UC: Manage BOM Recipe Configurations -->
  <g id="UC_BOM_MGT">
    <ellipse cx="1010" cy="465" rx="155" ry="20" class="uc-oval" />
    <text x="1010" y="465" class="uc-label">Manage BOM Recipe Configurations</text>
  </g>
  <!-- UC: Register New Master Ingredient -->
  <g id="UC_ING_ADD">
    <ellipse cx="1010" cy="520" rx="145" ry="20" class="uc-oval" />
    <text x="1010" y="520" class="uc-label">Register New Master Ingredient</text>
  </g>
  <!-- UC: View Enterprise KPI Dashboard -->
  <g id="UC_DASH">
    <ellipse cx="1010" cy="615" rx="145" ry="20" class="uc-oval" />
    <text x="1010" y="615" class="uc-label">View Enterprise KPI Dashboard</text>
  </g>
  <!-- UC: View Prescriptive Action Cards -->
  <g id="UC_PRESC_VIEW">
    <ellipse cx="1010" cy="670" rx="145" ry="20" class="uc-oval" />
    <text x="1010" y="670" class="uc-label">View Prescriptive Action Cards</text>
  </g>
  <!-- UC: Approve / Override Recommendations -->
  <g id="UC_PRESC_DEC">
    <ellipse cx="1010" cy="725" rx="160" ry="20" class="uc-oval" />
    <text x="1010" y="725" class="uc-label">Approve / Override Recommendations</text>
  </g>
  <!-- UC: Consult AI Sales Analyst Chatbot -->
  <g id="UC_CHAT">
    <ellipse cx="1010" cy="780" rx="145" ry="20" class="uc-oval" />
    <text x="1010" y="780" class="uc-label">Consult AI Sales Analyst Chatbot</text>
  </g>
  <!-- UC: Export Enterprise KPI CSV Report -->
  <g id="UC_CSV">
    <ellipse cx="1010" cy="835" rx="150" ry="20" class="uc-oval" />
    <text x="1010" y="835" class="uc-label">Export Enterprise KPI CSV Report</text>
  </g>
  <!-- UC: Manage User Accounts & Branches -->
  <g id="UC_USER">
    <ellipse cx="470" cy="735" rx="145" ry="20" class="uc-oval" />
    <text x="470" y="735" class="uc-label">Manage User Accounts & Branches</text>
  </g>
  <!-- UC: Inspect System Audit Logs -->
  <g id="UC_AUDIT">
    <ellipse cx="470" cy="795" rx="135" ry="20" class="uc-oval" />
    <text x="470" y="795" class="uc-label">Inspect System Audit Logs</text>
  </g>
  <!-- UC: Manage External Variables (Events/Weather) -->
  <g id="UC_EXT_VAR">
    <ellipse cx="740" cy="895" rx="165" ry="20" class="uc-oval" />
    <text x="740" y="895" class="uc-label">Manage External Variables (Events/Weather)</text>
  </g>
  <!-- UC: Execute Batch ETL Pipeline & Archival -->
  <g id="UC_ETL">
    <ellipse cx="740" cy="950" rx="160" ry="20" class="uc-oval" />
    <text x="740" y="950" class="uc-label">Execute Batch ETL Pipeline & Archival</text>
  </g>
  <!-- UC: Verify Two-Factor Auth (OTP/Trusted Token) -->
  <g id="UC_2FA">
    <ellipse cx="740" cy="1005" rx="175" ry="21" class="uc-oval" />
    <text x="740" y="1005" class="uc-label">Verify Two-Factor Auth (OTP/Trusted Token)</text>
  </g>
  <!-- Manuscript Figure Label -->
  <text x="740" y="1060" class="caption-text" text-anchor="middle">Figure 4: UML Use Case Diagram for Sweet Box Multi-Branch Enterprise System (4 Official Roles)</text>
</svg>