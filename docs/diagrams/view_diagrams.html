    let currentDiagramKey = 'fig1';

    async function renderDiagram(key) {
        currentDiagramKey = key;
        const d = diagrams[key];
        document.getElementById('diagram-title').innerText = d.title;
        document.getElementById('diagram-desc').innerText = d.desc;
        
        const btnSvg = document.getElementById('btn-standalone-svg');
        if (btnSvg) {
            btnSvg.style.display = (key === 'fig4') ? 'inline-block' : 'none';
        }

        const container = document.getElementById('svg-output');
        container.innerHTML = '<div class="spinner-border text-warning" role="status"></div>';
        
        try {
            const id = 'mermaid-' + Math.random().toString(36).substring(7);
            const { svg } = await mermaid.render(id, d.code);
            container.innerHTML = svg;
        } catch (e) {
            container.innerHTML = '<div class="alert alert-danger">Rendering Error: ' + e.message + '</div>';
        }
    }

    document.querySelectorAll('#diagram-tabs button').forEach(btn => {
        btn.addEventListener('click', function() {
            document.querySelectorAll('#diagram-tabs button').forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            renderDiagram(this.getAttribute('data-id'));
        });
    });

    function copyMermaid() {
        const code = diagrams[currentDiagramKey].code;
        navigator.clipboard.writeText(code).then(() => {
            alert('Mermaid syntax copied to clipboard!');
        });
    }

    function downloadSVG() {
        const svgElement = document.querySelector('#svg-output svg');
        if (!svgElement) return;
        const svgData = new XMLSerializer().serializeToString(svgElement);
        const blob = new Blob([svgData], { type: 'image/svg+xml;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = currentDiagramKey + '.svg';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }

    // Initial render
    renderDiagram('fig1');
</script>
